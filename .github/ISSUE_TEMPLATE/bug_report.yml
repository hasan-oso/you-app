name: 🐛 Bug Report
description: Report a bug you encountered in the app
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the form below so we can reproduce and fix it quickly.

        **Do not include personal data, authentication tokens, or screenshots of other users.**

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Numbered steps so we can trigger the bug deterministically.
      placeholder: |
        1. Open the app
        2. Tap on …
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: I expected …
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: Instead, …
    validations:
      required: true

  - type: dropdown
    id: device-os
    attributes:
      label: Device OS
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device Model & OS Version
      placeholder: e.g. Samsung Galaxy S23, Android 14
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: e.g. 1.2.2 (build 22)
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: App Language
      options:
        - Arabic (العربية)
        - Turkish (Türkçe)
        - English
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots / Additional Context
      description: Drag screenshots here, or paste logs. Redact any personal info.
